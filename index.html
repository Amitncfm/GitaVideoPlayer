<!doctype html>
<html lang="hi">
<head>

<meta name="description" content="श्रीमद्भगवद्गीता के पहले अध्याय अर्जुनविषाद योग का हिंदी पाठ और शब्द-हाइलाइट सहित वाचन।">
<title>श्रीमद्भगवद्गीता — अध्याय 1 — अर्जुनविषाद योग</title>
<style>
:root{color-scheme:light;--ink:#172338;--navy:#102a43;--navy2:#173b55;--gold:#f2b84b;--paper:#fffdf7;--muted:#637086;--line:#e5e0d2;--shadow:0 7px 20px rgba(21,35,52,.10)}
*{box-sizing:border-box}
html{scroll-behavior:smooth;-webkit-text-size-adjust:100%}
body{margin:0;background:radial-gradient(ellipse at top,#fff7df 0,#f3f5f8 50%,#e9edf3 100%);font-family:system-ui,-apple-system,"Noto Sans Devanagari","Mangal",sans-serif;color:var(--ink);font-weight:600;overflow-x:hidden}
button,a{font:inherit}button,a{-webkit-tap-highlight-color:transparent;touch-action:manipulation}
button:focus-visible,a:focus-visible{outline:3px solid #1479d2;outline-offset:3px}
#app{width:100%;max-width:1000px;margin:0 auto;min-height:100svh;background:rgba(255,255,255,.55);box-shadow:0 0 46px rgba(25,39,55,.09)}
.reader-sticky{position:sticky;top:0;z-index:40;background:linear-gradient(150deg,#102a43,#173b55);padding:6px 8px 8px;border-radius:0 0 15px 15px;box-shadow:0 5px 15px rgba(9,28,43,.23);color:#fff}
.compact-player{display:flex;align-items:center;gap:6px;min-height:40px;width:100%}
.tiny-button{flex:0 0 auto;min-width:36px;height:35px;padding:4px 7px;display:inline-flex;align-items:center;justify-content:center;border:1px solid #648093;border-radius:9px;background:#1c435b;color:#fff;font-size:15px;line-height:1;font-weight:950;cursor:pointer;text-decoration:none}
.tiny-button.primary{min-width:40px;background:linear-gradient(135deg,#ffe6a2,#ffc849);color:#1c2b36;border-color:#ffe6a2;font-size:16px}
.tiny-button.rate{min-width:45px;color:#fff0c5;border-color:#bd9953;background:#27465a;font-size:12px}
.compact-title{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px;line-height:1.15;overflow:hidden}
.compact-title strong{font-size:13px;font-weight:950;color:#fff;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.compact-title span{font-size:10px;font-weight:750;color:#d7e4ea;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.reader-meta{display:flex;align-items:center;gap:7px;margin:5px 2px 0;min-height:10px}
.reader-progress-track{height:4px;flex:1;min-width:0;background:rgba(255,255,255,.22);border-radius:99px;overflow:hidden}
.reader-progress-fill{height:100%;width:0;background:#ffd36b;border-radius:99px;transition:width .12s linear}
.reader-status{flex:0 0 auto;max-width:140px;font-size:10px;line-height:1.2;color:#e5edf1;font-weight:800;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.reading-pane{padding:12px 10px calc(38px + env(safe-area-inset-bottom));max-width:900px;margin:0 auto}
.reading-text{background:#fff;border-radius:13px;border:1px solid #e4e8ec;padding:17px 13px;font-size:clamp(25px,6.8vw,35px);font-weight:900;line-height:1.85;color:#080b10;box-shadow:0 4px 15px rgba(21,35,52,.08);overflow-wrap:anywhere;word-break:normal}
.reading-paragraph{margin:0 0 1.05em;white-space:normal}
.reading-paragraph:last-child{margin-bottom:0}
.reading-paragraph.body-text{position:relative;padding-left:.35em}
.reading-paragraph.body-text:before{content:"•";position:absolute;left:-.35em;color:#9d6415;font-weight:1000}
.book-title{font-size:1.08em;line-height:1.35;text-align:center;color:#102a43;font-weight:1000;margin:0 0 .35em}
.chapter-title{font-size:.92em;line-height:1.4;text-align:center;color:#9a5c08;font-weight:1000;margin:0 0 1.1em}
.section-title{font-size:.77em;line-height:1.5;color:#173b55;font-weight:1000;margin:1.25em 0 .7em;padding:.45em .6em;border-left:5px solid #e8ad38;border-radius:7px;background:#fff5d9}
.closing-text{font-size:.83em;font-weight:850;color:#26374b;border-top:2px solid #ead8ac;padding-top:1em;margin-top:1.25em}
.mantra-text{text-align:center;color:#9c5d08;font-size:1em;font-weight:1000;margin-top:1.2em}
.word{border-radius:5px;padding:0 1px;color:#080b10;font-weight:950;-webkit-box-decoration-break:clone;box-decoration-break:clone}
.word.active{background:#b9defe;color:#000;box-shadow:0 0 0 2px #b9defe;font-weight:1000}
.reader-note{color:#445268;font-size:12px;line-height:1.6;font-weight:750;margin:12px 3px 0}
.status-toast{position:fixed;bottom:calc(14px + env(safe-area-inset-bottom));left:50%;transform:translateX(-50%);z-index:100;width:max-content;max-width:calc(100vw - 30px);padding:11px 15px;border-radius:14px;background:#152d40;color:#fff;font-size:13px;font-weight:850;box-shadow:0 6px 24px rgba(0,0,0,.25);text-align:center}
[hidden]{display:none!important}
@media(min-width:620px){.reader-sticky{padding:7px 13px 9px}.compact-title strong{font-size:14px}.compact-title span{font-size:11px}.reading-pane{padding:17px 20px 50px}.reading-text{font-size:34px;padding:22px 22px}.tiny-button{height:37px}}
@media(max-width:360px){.reading-pane{padding-left:8px;padding-right:8px}.reading-text{font-size:24px;padding:14px 10px;line-height:1.88}.tiny-button{min-width:31px;height:32px;padding:4px 5px}.tiny-button.rate{min-width:39px}.compact-player{gap:4px}.compact-title strong{font-size:11px}.compact-title span{font-size:9px}.reader-status{max-width:105px}}
@media(prefers-reduced-motion:reduce){html{scroll-behavior:auto}*,*:before,*:after{transition:none!important}}
</style>
</head>
<body>
<div id="app">
  <header class="reader-sticky" id="readerSticky">
    <div class="compact-player">
      <a class="tiny-button" id="backButton" href="../index.html" aria-label="मुख्य अध्याय सूची पर वापस जाएँ" title="मुख्य पृष्ठ पर वापस जाएँ">←</a>
      <div class="compact-title"><strong>श्रीमद्भगवद्गीता</strong><span>अध्याय 1 · अर्जुनविषाद योग</span></div>
      <button type="button" id="readButton" class="tiny-button primary" aria-label="पाठ चलाएँ या रोकें" title="पाठ चलाएँ या रोकें">▶</button>
      <button type="button" id="speechRateButton" class="tiny-button rate" aria-label="पाठ-वाचन की गति बदलें" title="वाचन गति बदलें">1×</button>
      <button type="button" id="fontSizeButton" class="tiny-button" aria-label="पाठ का अक्षर आकार बढ़ाएँ" title="अक्षर आकार बढ़ाएँ">A+</button>

  <main class="reading-pane">
    <article class="reading-text" id="readingText" aria-label="श्रीमद्भगवद्गीता अध्याय एक का हिंदी पाठ"></article>
    <p class="reader-note" id="readerNote">वाचन शुरू करने के लिए ▶ दबाएँ। पढ़े जा रहे शब्द का रंग बदलेगा। गति बदलने के लिए 1× बटन दबाएँ। हिंदी वाणी की उपलब्धता आपके मोबाइल और ब्राउज़र पर निर्भर करती है।</p>
  </main>
</div>
<div id="statusToast" class="status-toast" role="status" aria-live="polite" hidden></div>
<script>
'use strict';
const blocks = [{"type":"book-title","text":"श्रीमद्भगवद्गीता"},{"type":"chapter-title","text":"पहला अध्याय"},{"type":"section","text":"कुरुक्षेत्र की युद्धभूमि में सेनाओं का निरीक्षण"},{"type":"p","text":"राजा धृतराष्ट्र ने कहा: हे संजय! धर्मभूमि कुरुक्षेत्र में युद्ध करने की इच्छा से एकत्र हुए मेरे पुत्रों और पांडु के पुत्रों ने क्या किया?"},{"type":"p","text":"संजय ने कहा: हे राजन! पांडवों की सेना को युद्ध के लिए व्यूह-रचना में सजा हुआ देखकर राजा दुर्योधन अपने आचार्य द्रोणाचार्य के पास गए और उनसे ये वचन कहे।"},{"type":"p","text":"हे आचार्य! पांडु के पुत्रों की इस विशाल सेना को देखिए, जिसे आपके बुद्धिमान शिष्य और राजा द्रुपद के पुत्र धृष्टद्युम्न ने कुशलतापूर्वक युद्ध के लिए सजाया है।"},{"type":"p","text":"इस सेना में भीम और अर्जुन के समान पराक्रमी अनेक महान धनुर्धर हैं। इनमें युयुधान, राजा विराट और महारथी द्रुपद जैसे योद्धा भी हैं।"},{"type":"p","text":"इस सेना में धृष्टकेतु, चेकितान, पराक्रमी काशिराज, पुरुजित, कुन्तिभोज और शैब्य जैसे महान, वीर और शक्तिशाली योद्धा भी हैं।"},{"type":"p","text":"यहाँ पराक्रमी युधामन्यु, अत्यंत शक्तिशाली उत्तमौजा, सुभद्रा के पुत्र अभिमन्यु और द्रौपदी के पाँचों पुत्र भी उपस्थित हैं। ये सभी महान रथी हैं।"},{"type":"p","text":"हे ब्राह्मणों में श्रेष्ठ! अब मैं आपको अपनी सेना के उन प्रमुख सेनानायकों के बारे में बताता हूँ, जो मेरी सेना का नेतृत्व करने में विशेष रूप से योग्य हैं।"},{"type":"p","text":"हमारी सेना में आप स्वयं, भीष्म, कर्ण, कृपाचार्य, अश्वत्थामा, विकर्ण और सोमदत्त के पुत्र भूरिश्रवा जैसे योद्धा हैं, जो युद्ध में सदैव विजयी रहे हैं।"},{"type":"p","text":"इनके अतिरिक्त भी अनेक वीर योद्धा मेरे लिए अपने प्राणों का त्याग करने को तैयार हैं। वे सभी विभिन्न प्रकार के हथियारों से सुसज्जित हैं और युद्ध-कला में अनुभवी हैं।"},{"type":"p","text":"हमारी सेना की शक्ति असीमित है और पितामह भीष्म द्वारा उसकी भली-भाँति रक्षा की जा रही है, जबकि भीम द्वारा सावधानीपूर्वक सुरक्षित पांडवों की सेना की शक्ति सीमित है।"},{"type":"p","text":"इसलिए आप सभी सेना के अपने-अपने निर्धारित मोर्चों पर डटे रहें और पितामह भीष्म को पूरा सहयोग देते हुए उनकी रक्षा करें।"},{"type":"section","text":"योद्धाओं द्वारा शंख ध्वनि"},{"type":"p","text":"तब कुरुवंश के वृद्ध और महान पराक्रमी पितामह भीष्म ने दुर्योधन को प्रसन्न करते हुए सिंह की गर्जना के समान ऊँची ध्वनि में अपना शंख बजाया।"},{"type":"p","text":"इसके बाद शंख, नगाड़े, बिगुल, तुरहियाँ और सींग आदि सभी युद्ध के वाद्य अचानक एक साथ बज उठे। उनकी मिली-जुली ध्वनि अत्यंत भयंकर थी।"},{"type":"p","text":"दूसरी ओर सफेद घोड़ों से जुते विशाल रथ पर बैठे भगवान श्रीकृष्ण और अर्जुन ने भी अपने दिव्य शंख बजाए।"},{"type":"p","text":"भगवान श्रीकृष्ण ने पांचजन्य नामक शंख बजाया, अर्जुन ने देवदत्त नामक शंख बजाया और अत्यधिक भोजन करने वाले तथा महान पराक्रम के कार्य करने वाले भीम ने पौण्ड्र नामक भयंकर शंख बजाया।"},{"type":"p","text":"कुन्तीपुत्र राजा युधिष्ठिर ने अनंतविजय नामक शंख बजाया तथा नकुल और सहदेव ने सुघोष और मणिपुष्पक नामक शंख बजाए।"},{"type":"p","text":"महान धनुर्धर काशिराज, महान योद्धा शिखंडी, धृष्टद्युम्न, राजा विराट और अपराजित सात्यकि ने भी अपने-अपने शंख बजाए।"},{"type":"p","text":"हे राजन! राजा द्रुपद, द्रौपदी के पाँचों पुत्र और बलशाली अभिमन्यु सहित अन्य सभी योद्धाओं ने भी अपने-अपने शंख अलग-अलग बजाए।"},{"type":"p","text":"उन सभी शंखों की ध्वनि आकाश और पृथ्वी में गूँज उठी तथा उसने धृतराष्ट्र के पुत्रों के हृदयों को भय से विदीर्ण कर दिया।"},{"type":"section","text":"अर्जुन द्वारा दोनों सेनाओं का निरीक्षण"},{"type":"p","text":"उस समय हनुमान के चिह्न वाली ध्वजा से सुशोभित रथ पर बैठे पांडुपुत्र अर्जुन ने धनुष उठाया और बाण चलाने की तैयारी की। हे राजन! युद्ध के लिए व्यूह-रचना में खड़े धृतराष्ट्र के पुत्रों को देखकर अर्जुन ने भगवान श्रीकृष्ण से ये वचन कहे।"},{"type":"p","text":"अर्जुन ने कहा: हे अच्युत! कृपया मेरा रथ दोनों सेनाओं के बीच में खड़ा कर दीजिए।"},{"type":"p","text":"मैं यहाँ युद्ध करने की इच्छा से एकत्र हुए लोगों को देखना चाहता हूँ, ताकि जान सकूँ कि इस महान युद्ध में मुझे किन-किन योद्धाओं से मुकाबला करना होगा।"},{"type":"p","text":"मैं उन लोगों को भी देखना चाहता हूँ, जो धृतराष्ट्र के दुर्बुद्धि पुत्र को प्रसन्न करने की इच्छा से यहाँ युद्ध करने आए हैं।"},{"type":"p","text":"संजय ने कहा e":"p","text":"इन आक्रमणकारियों को मारने से हम पर पाप ही आएगा। इसलिए हे कृष्ण! धृतराष्ट्र के पुत्रों और अपने मित्रों को मारना हमारे लिए उचित नहीं है। अपने ही संबंधियों को मारकर हम सुखी कैसे हो सकते हैं?"},{"type":"p","text":"हे जनार्दन! यद्यपि लोभ से जिनका हृदय भर गया है, वे लोग अपने परिवार का नाश करने या मित्रों से वैर करने में कोई दोष नहीं देखते, फिर भी हमें, जो परिवार के विनाश में दोष देखते हैं, ऐसे पापपूर्ण कार्यों में क्यों लगना चाहिए?"},{"type":"p","text":"परिवार के नष्ट होने से उसकी पीढ़ियों से चली आ रही स्थायी पारिवारिक परंपराएँ समाप्त हो जाती हैं और परिवार के शेष लोग अधर्म में प्रवृत्त हो जाते हैं।"},{"type":"p","text":"हे कृष्ण! जब परिवार में अधर्म बढ़ जाता है, तब परिवार की स्त्रियाँ दूषित हो जाती हैं और स्त्रियों के आचरण में गिरावट आने से अवांछित संतानों की उत्पत्ति होती है।"},{"type":"p","text":"अवांछित संतानों की वृद्धि से परिवार और परिवार की परंपराओं का नाश करने वालों, दोनों को दुखद परिणाम भोगने पड़ते हैं। ऐसे परिवारों के पूर्वजों का पतन हो जाता है, क्योंकि उनके लिए भोजन और जल अर्पित करने की पारंपरिक क्रियाएँ पूरी तरह बंद हो जाती हैं।"},{"type":"p","text":"परिवार की परंपराओं का नाश करने और अवांछित संतानों को जन्म देने वाले लोगों के बुरे कार्यों से समाज के कल्याण के कार्य तथा परिवार की भलाई के लिए की जाने वाली गतिविधियाँ नष्ट हो जाती हैं।"},{"type":"p","text":"हे कृष्ण, प्रजा का पालन करने वाले प्रभु! मैंने गुरु-शिष्य परंपरा से सुना है कि जिन लोगों की पारिवारिक परंपराएँ नष्ट हो जाती हैं, वे सदैव नरक में रहते हैं।"},{"type":"p","text":"हाय! यह कितने आश्चर्य की बात है कि हम बड़े पापपूर्ण कार्य करने के लिए तैयार हो रहे हैं। राजसी सुख का आनंद लेने की इच्छा से प्रेरित होकर हम अपने ही संबंधियों को मारने के लिए तत्पर हैं।"},{"type":"p","text":"यदि धृतराष्ट्र के पुत्र हथियार लेकर युद्धभूमि में मुझे निहत्था और बिना विरोध किए खड़े होने पर मार डालें, तो भी मेरे लिए वही अधिक अच्छा होगा।"},{"type":"p","text":"संजय ने कहा: इस प्रकार युद्धभूमि में कहकर अर्जुन ने अपना धनुष और बाण एक ओर रख दिए और शोक से व्याकुल मन से अपने रथ पर बैठ गए।"},{"type":"closing","text":"इस प्रकार श्रीमद्भगवद्गीता के उपनिषदों, ब्रह्मविद्या और योगशास्त्र रूपी ग्रंथ में श्रीकृष्ण और अर्जुन के संवाद का अर्जुन-विषाद-योग नामक पहला अध्याय पूर्ण हुआ।"},{"type":"mantra","text":"हरि ॐ तत् सत्॥"}];
const $ = id => document.getElementById(id);

let rateIndex=0, speechRate=1, speechState='idle', sessionToken=0, speechUtterance=null;
let speechSegments=[], words=[], textForReading='', currentCursor=0, highlightedWordIndex=-1;
let fallbackTimer=null, segmentBoundarySeen=false, segmentStartTime=0, lastAutoScrollAt=0, toastTimer=null;
function toast(message){const box=$('statusToast');box.textContent=message;box.hidden=false;clearTimeout(toastTimer);toastTimer=setTimeout(()=>box.hidden=true,2800);}
function chooseHindiVoice(){if(!('speechSynthesis'in window))return null;const all=window.speechSynthesis.getVoices()||[];const hindi=all.filter(v=>/^hi(?:[-_]|$)/i.test(v.lang||''));hindi.sort((a,b)=>{const score=v=>((/^hi[-_]IN$/i.test(v.lang||'')?8:0)+(/hindi|हिन्दी|हिंदी/i.test(v.name||'')?4:0)+(/google/i.test(v.name||'')?2:0)+(v.localService?1:0)+(v.default?.5:0));return score(b)-score(a);});return hindi[0]||null;}
function buildSpeechSegments(text){const result=[];const re=/[^.!?।\n]+[.!?।]*/gu;let m;while((m=re.exec(text))!==null){const raw=m[0],leading=raw.search(/\S/);if(leading<0)continue;const clean=raw.trim();if(!clean)continue;const start=m.index+leading;result.push({start,end:start+clean.length,text:clean});}return result;}
function findWordAt(charIndex){let lo=0,hi=words.length-1;while(lo<=hi){const mid=(lo+hi)>>1,start=Number(words[mid].dataset.charStart),end=Number(words[mid].dataset.charEnd);if(charIndex<start)hi=mid-1;else if(charIndex>=end)lo=mid+1;else return mid;}if(lo<words.length)return lo;return words.length-1;}
function updateProgress(){const len=textForReading.length||1;$('readerProgressFill').style.width=`${Math.max(0,Math.min(100,currentCursor/len*100))}%`;if($('readButton'))$('readButton').textContent=(speechState==='speaking'||speechState==='starting')?'Ⅱ':'▶';if(speechState==='speaking'||speechState==='starting')$('readerStatus').textContent=`हिंदी वाचन · ${speechRate}×`;else if(speechState==='paused')$('readerStatus').textContent=`रुका हुआ · ${speechRate}×`;else if(currentCursor>=textForReading.length&&textForReading.length)$('readerStatus').textContent='पाठ पूरा हुआ';else $('readerStatus').textContent=`हिंदी वाचन · ${speechRate}×`;}
function saveCursor(value){currentCursor=Math.max(0,Math.min(Number(value)||0,textForReading.length));updateProgress();}
function highlightWordIndex(index,shouldScroll=true){if(!Number.isInteger(index)||index<0||index>=words.length)return;if(highlightedWordIndex!==index){if(highlightedWordIndex>=0&&words[highlightedWordIndex])words[highlightedWordIndex].classList.remove('active');words[index].classList.add('active');highlightedWordIndex=index;}const start=Number(words[index].dataset.charStart);if(Number.isFinite(start))saveCursor(start);if(shouldScroll){const sticky=$('readerSticky').getBoundingClientRect(),r=words[index].getBoundingClientRect(),vh=window.innerHeight,topLimit=Math.max(sticky.bottom+10,72),now=performance.now();if(now-lastAutoScrollAt>650&&(r.top<topLimit-4||r.bottom>vh*.9)){window.scrollBy({top:r.top-(topLimit+Math.max(28,(vh-topLimit)*.18)),behavior:'smooth'});lastAutoScrollAt=now;}}}
function clearHighlight(){if(highlightedWordIndex>=0&&words[highlightedWordIndex])words[highlightedWordIndex].classList.remove('active');highlightedWordIndex=-1;}
function renderTranscript(){const holder=$('readingText');holder.replaceChildren();words=[];clearHighlight();let base=0;const flat=[];blocks.forEach((block,bi)=>{const tag=(block.type==='book-title'||block.type==='chapter-title'||block.type==='section')?'h2':'p';const el=document.createElement(tag);el.className='reading-paragraph '+({'book-title':'book-title','chapter-title':'chapter-title','section':'section-title','p':'body-text','closing':'closing-text','mantra':'mantra-text'}[block.type]||'');const re=/\S+/gu;let match,last=0;while((match=re.exec(block.text))!==null){if(match.index>last)el.appendChild(document.createTextNode(block.text.slice(last,match.index)));const span=document.createElement('span');span.className='word';span.textContent=match[0];span.dataset.wordIndex=String(words.length);span.dataset.charStart=String(base+match.index);span.dataset.charEnd=String(base+match.index+match[0].length);el.appendChild(span);words.push(span);last=match.index+match[0].length;}if(last<block.text.length)el.appendChild(document.createTextNode(block.text.slice(last)));holder.appendChild(el);flat.push(block.text);base+=block.text.length+(bi<blocks.length-1?2:0);});textForReading=flat.join('\n\n');speechSegments=buildSpeechSegments(textForReading);currentCursor=0;updateProgress();if(words.length)highlightWordIndex(0,false);}
function stopFallbackTimer(){if(fallbackTimer!==null){clearInterval(fallbackTimer);fallbackTimer=null;}}
function invalidateSpeech(){sessionToken++;stopFallbackTimer();try{if('speechSynthesis'in window)window.speechSynthesis.cancel();}catch(_){}speechUtterance=null;speechState='idle';}
function startFallbackTimer(token,utteranceText,base){stopFallbackTimer();segmentStartTime=performance.now();if(segmentBoundarySeen)return;const visible=words.map((el,i)=>({i,start:Number(el.dataset.charStart),end:Number(el.dataset.charEnd),len:Math.max(1,el.textContent.length)})).filter(w=>w.end>base&&w.start<base+utteranceText.length);if(!visible.length)return;const expectedMs=Math.max(650,(utteranceText.length*58+((utteranceText.match(/[,.!?।]/g)||[]).length*95))/speechRate);fallbackTimer=setInterval(()=>{if(token!==sessionToken||speechState!=='speaking'||segmentBoundarySeen)return;const ratio=Math.min(.96,(performance.now()-segmentStartTime)/expectedMs);let target=Math.floor(ratio*visible.reduce((s,w)=>s+w.len,0)),item=visible[visible.length-1];for(const w of visible){target-=w.len;if(target<0){item=w;break;}}highlightWordIndex(item.i,true);},100);}
function speakSegment(index,startAt,token){if(token!==sessionToken)return;if(index>=speechSegments.length){speechState='idle';speechUtterance=null;saveCursor(textForReading.length);updateProgress();return;}const seg=speechSegments[index],base=Math.max(seg.start,Math.min(startAt??seg.start,seg.end)),phrase=textForReading.slice(base,seg.end).trim();if(!phrase){speakSegment(index+1,undefined,token);return;}const actualBase=textForReading.indexOf(phrase,base),utteranceBase=actualBase>=base?actualBase:base;const utterance=new SpeechSynthesisUtterance(phrase);speechUtterance=utterance;utterance.lang='hi-IN';utterance.rate=speechRate;utterance.volume=1;utterance.pitch=1;const voice=chooseHindiVoice();if(voice)utterance.voice=voice;segmentBoundarySeen=false;utterance.onstart=()=>{if(token!==sessionToken)return;speechState='speaking';updateProgress();const wi=findWordAt(utteranceBase);if(wi>=0)highlightWordIndex(wi,true);startFallbackTimer(token,phrase,utteranceBase);};utterance.onboundary=e=>{if(token!==sessionToken||typeof e.charIndex!=='number')return;segmentBoundarySeen=true;stopFallbackTimer();const wi=findWordAt(utteranceBase+e.charIndex);if(wi>=0)highlightWordIndex(wi,true);};utterance.onpause=()=>{if(token!==sessionToken)return;speechState='paused';stopFallbackTimer();updateProgress();};utterance.onend=()=>{if(token!==sessionToken)return;stopFallbackTimer();speechUtterance=null;saveCursor(seg.end);speakSegment(index+1,undefined,token);};utterance.onerror=e=>{if(token!==sessionToken)return;stopFallbackTimer();speechUtterance=null;speechState='idle';updateProgress();if(e.error!=='canceled'&&e.error!=='interrupted')toast('हिंदी वाणी नहीं चल सकी। मोबाइल की हिंदी पाठ-वाचन आवाज़ जाँचें।');};speechState='starting';updateProgress();try{window.speechSynthesis.speak(utterance);}catch(_){speechState='idle';speechUtterance=null;updateProgress();toast('इस ब्राउज़र में पाठ-वाचन शुरू नहीं हो सका।');}}
function startSpeechAt(cursor){if(!textForReading){toast('पाठ उपलब्ध नहीं है।');return;}if(!('speechSynthesis'in window)||typeof SpeechSynthesisUtterance==='undefined'){toast('इस ब्राउज़र में पाठ-वाचन उपलब्ध नहीं है।');return;}if(!speechSegments.length)speechSegments=buildSpeechSegments(textForReading);let pos=Math.max(0,Math.min(cursor,textForReading.length));if(pos>=textForReading.length)pos=0;const wi=findWordAt(pos);if(wi>=0){pos=Number(words[wi].dataset.charStart);highlightWordIndex(wi,true);}saveCursor(pos);const idx=speechSegments.findIndex(seg=>seg.end>pos);if(idx<0){toast('पाठ पूरा हो चुका है।');return;}const voice=chooseHindiVoice(),voices=window.speechSynthesis.getVoices()||[];if(voices.length&&!voice)toast('मोबाइल में हिंदी आवाज़ स्थापित करें।');stopFallbackTimer();const token=++sessionToken;speechState='starting';updateProgress();setTimeout(()=>{if(token===sessionToken)speakSegment(idx,pos,token);},90);}
function toggleSpeech(){if(speechState==='speaking'||speechState==='starting'){const at=currentCursor;invalidateSpeech();speechState='paused';saveCursor(at);updateProgress();$('readButton').textContent='▶';return;}if(speechState==='paused'){startSpeechAt(currentCursor);return;}startSpeechAt(currentCursor);}
function cycleSpeechRate(){const running=speechState==='speaking'||speechState==='starting',at=currentCursor;rateIndex=(rateIndex+1)%SPEECH_RATES.length;speechRate=SPEECH_RATES[rateIndex];$('speechRateButton').textContent=`${speechRate}×`;if(running){invalidateSpeech();startSpeechAt(at);}else updateProgress();}
$('readButton').addEventListener('click',()=>{toggleSpeech();$('readButton').textContent=(speechState==='speaking'||speechState==='starting')?'Ⅱ':'▶';});
$('speechRateButton').addEventListener('click',cycleSpeechRate);
let fontSizeLevel=0;
let originalReadingFontSize=null;
$('fontSizeButton').addEventListener('click',()=>{
  const readingText=$('readingText');
  if(originalReadingFontSize===null){
    originalReadingFontSize=parseFloat(window.getComputedStyle(readingText).fontSize);
  }
  fontSizeLevel=(fontSizeLevel+1)%4;
  if(fontSizeLevel===0){
    readingText.style.removeProperty('font-size');
    $('fontSizeButton').textContent='A+';
    $('fontSizeButton').setAttribute('aria-label','पाठ का अक्षर आकार बढ़ाएँ');
    $('fontSizeButton').title='अक्षर आकार बढ़ाएँ';
    originalReadingFontSize=null;
    return;
  }
  const scale=[1,1.15,1.30,1.45][fontSizeLevel];
  readingText.style.fontSize=(originalReadingFontSize*scale)+'px';
  $('fontSizeButton').textContent=['A+','A++','A+++'][fontSizeLevel-1];
  $('fontSizeButton').setAttribute('aria-label','अक्षर आकार बढ़ा हुआ स्तर '+fontSizeLevel);
  $('fontSizeButton').title='अक्षर आकार: '+fontSizeLevel+'/3';
});
window.addEventListener('beforeunload',()=>{stopFallbackTimer();try{window.speechSynthesis?.cancel();}catch(_){}});
window.addEventListener('pagehide',()=>{stopFallbackTimer();try{window.speechSynthesis?.cancel();}catch(_){}});
if('speechSynthesis'in window)window.speechSynthesis.addEventListener?.('voiceschanged',()=>chooseHindiVoice());
renderTranscript();
</script>
